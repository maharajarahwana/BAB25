  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bab25</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:15px;
}

.card{
  background:white;
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px 20px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#question{
  font-size:42px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:10px;
  border:2px solid orange;
  border-radius:6px;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:15px;
  cursor:pointer;
  background:#007BFF;
  color:white;
  border:none;
  border-radius:6px;
}

.result{
  font-size:20px;
  font-weight:bold;
}

.correct{
  color:green;
}

.wrong{
  color:red;
}

/* Perbaikan agar nomor tidak terpotong */

ol{
  text-align:left;
  max-height:65vh;
  overflow-y:auto;
  padding-left:30px;
  margin:0;
}

li{
  margin-bottom:8px;
  line-height:1.4;
}

</style>
</head>

<body>

<div class="card">

<h2 id="question"></h2>

<input type="text" id="answerInput" placeholder="Tulis jawaban di sini">

<button id="nextBtn">Selanjutnya</button>

</div>

<script>

let questions = [

{ soal: "외국인 근로자 지원기관", jawaban: "lembaga bantuan pekerja asing" },
{ soal: "외국인 근로자", jawaban: "pekerja asing" },

{ soal: "수업", jawaban: "pelajaran" },

{ soal: "-(으)러", jawaban: "untuk / bermaksud melakukan sesuatu" },
{ soal: "통역 서비스", jawaban: "layanan penerjemahan" },
{ soal: "-기 때문에", jawaban: "karena" },
{ soal: "행사에 참여하다", jawaban: "Menghadiri acara" },
{ soal: "교육 프로그램", jawaban: "program pendidikan" },
{ soal: "무료 진료소", jawaban: "klinik gratis" },
{ soal: "한국어 교육", jawaban: "pendidikan bahasa korea" },
{ soal: "대상", jawaban: "Target" },
{ soal: "컴퓨터 교육", jawaban: "pendidikan komputer" },
{ soal: "법률 교육", jawaban: "pendidikan hukum" },
{ soal: "무료진료를 받다", jawaban: "menerima pengobatan gratis" },
{ soal: "직업 훈련", jawaban: "pelatihan pekerjaan" },
{ soal: "자원 봉사를 하다", jawaban: "menjadi sukarelawan" },
{ soal: "안전 교육", jawaban: "pendidikan keselamatan" },
{ soal: "떨리다", jawaban: "gugup" },
{ soal: "걱정하다", jawaban: "khawatir" },
{ soal: "문화 체험", jawaban: "pengalaman budaya" },
{ soal: "모집", jawaban: "penerimaan / pendaftaran" },
{ soal: "고용 허가제", jawaban: "sistem ijin kerja" },
{ soal: "교육 기간", jawaban: "waktu pendidikan" },
{ soal: "고용하다", jawaban: "memperkerjakan" },
{ soal: "초급 반", jawaban: "kelas tingkat dasar" },
{ soal: "중급 반", jawaban: "kelas tingkat menengah" },
{ soal: "고급 반", jawaban: "kelas tingkat tinggi" },
{ soal: "교육 내용", jawaban: "materi pendidikan" },
{ soal: "토픽반", jawaban: "kelas ujian topik" },
{ soal: "신청 방법", jawaban: "cara pendaftaran" },
{ soal: "한국 산업 인력 공단", jawaban: "layanan HRD korea" },
{ soal: "방문 접수", jawaban: "pendaftaran langsung" },
{ soal: "문의", jawaban: "pertanyaan" },
{ soal: "농촌 지역", jawaban: "daerah pedesaan" },
{ soal: "맞다", jawaban: "benar" },
{ soal: "중소 도시", jawaban: "kota kecil dan menengah" },
{ soal: "여러", jawaban: "beberapa" },
{ soal: "체계적이다", jawaban: "sistematis" },
{ soal: "다", jawaban: "semua" },
{ soal: "효율적인", jawaban: "efisien" },
{ soal: "직업", jawaban: "pekerjaan" },
{ soal: "권익 보호", jawaban: "perlindungan hak" },
{ soal: "목욕", jawaban: "mandi" },
{ soal: "사회", jawaban: "masyarakat" },
{ soal: "금연", jawaban: "dilarang merokok" },
{ soal: "구축", jawaban: "pembangunan" },
{ soal: "얼음", jawaban: "es batu" },
{ soal: "꾸준히", jawaban: "secara konsisten" },
{ soal: "참가 대상", jawaban: "target peserta" },
{ soal: "상담", jawaban: "konsultasi" },
{ soal: "전화 접수", jawaban: "pendaftaran via telepon" },

];

questions = questions.sort(()=>Math.random()-0.5);

let index = 0;
let score = 0;
let userAnswers = [];

const questionEl = document.getElementById("question");
const answerInput = document.getElementById("answerInput");
const nextBtn = document.getElementById("nextBtn");
const card = document.querySelector(".card");

function showQuestion(){
  questionEl.textContent = questions[index].soal;
  answerInput.value="";
  answerInput.focus();
}

nextBtn.addEventListener("click",()=>{

  const userAnswer = answerInput.value.trim().toLowerCase();

  userAnswers[index] = userAnswer;

  if(userAnswer === questions[index].jawaban){
    score++;
  }

  index++;

  if(index < questions.length){
    showQuestion();
  }else{
    showResult();
  }

});

function showResult(){

  let answerList="";

  questions.forEach((q,i)=>{

    if(userAnswers[i] === q.jawaban){
      answerList += `<li>${q.soal} = <span class="correct">${q.jawaban}</span></li>`;
    }else{
      answerList += `<li>${q.soal} = <span class="correct">${q.jawaban}</span><br>
      Jawaban kamu: <span class="wrong">${userAnswers[i] || "(kosong)"}</span></li>`;
    }

  });

  card.innerHTML = `
  <hr>
  <p>Kunci Jawaban:</p>
  <ol>${answerList}</ol>
  `;

}

showQuestion();

</script>

</body>
</html>
